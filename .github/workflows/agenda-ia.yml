# Agenda casi automática (v5 · Fase 4.2). APAGADO por defecto: solo corre a mano (Actions → Agenda con IA → Run workflow).
# Para que corra solo una vez al día, quita el "#" de las dos líneas de "schedule" de abajo.
# Necesita los secretos GEMINI_API_KEY y FIREBASE_SA (Settings → Secrets and variables → Actions). Ver docs/agenda-ia.md.
name: Agenda con IA

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 11 * * *"   # 6:00 a. m. en Colombia

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: herramientas/agenda-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node extraer.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
