# Procesos automáticos en Python (automatizacion/). Ver automatizacion/LEEME.md y docs/agenda-ia.md.
# - Agenda automática: todos los días a las 6:00 a. m. (hora de Colombia) y a mano (Actions → Agenda automática → Run workflow).
#   Cada 15 minutos revisa si el admin tocó «Buscar eventos ahora» en la app; si no, termina en segundos.
# - Limpieza diaria (6:00 a. m. y a mano): cupones vencidos, eventos de ejemplo y negocios sin foto.
# Necesita los secretos GEMINI_API_KEY y FIREBASE_SA (Settings → Secrets and variables → Actions); sin ellos no hace nada.
name: Agenda automática

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *' # 6:00 a. m. en Colombia (UTC-5)
    - cron: '*/15 * * * *' # pedidos desde la app

permissions:
  contents: read

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      DIARIA: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *' }}
    steps:
      - name: Sin secretos no hay nada que hacer
        if: env.FIREBASE_SA == ''
        run: echo "Falta el secreto FIREBASE_SA. Ver docs/agenda-ia.md."
      - uses: actions/checkout@v5
        if: env.FIREBASE_SA != ''
      - uses: actions/setup-python@v6
        if: env.FIREBASE_SA != ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automatizacion/requirements.txt
      - name: Instalar
        if: env.FIREBASE_SA != ''
        run: pip install -r automatizacion/requirements.txt
      - name: Agenda (diaria o manual)
        if: env.FIREBASE_SA != '' && env.DIARIA == 'true'
        run: python automatizacion/agenda.py --modo=${{ github.event_name == 'workflow_dispatch' && 'manual' || 'diaria' }}
      - name: Limpieza diaria
        if: env.FIREBASE_SA != '' && env.DIARIA == 'true'
        run: python automatizacion/limpieza.py
      - name: Pedido desde la app
        if: env.FIREBASE_SA != '' && github.event.schedule == '*/15 * * * *'
        run: python automatizacion/agenda.py --revisar
